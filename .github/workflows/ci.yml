name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --all-groups --frozen
      - name: Ruff lint
        run: uv run ruff check claude_db_memory tests mcp_server.py
      - name: Ruff format check
        run: uv run ruff format --check claude_db_memory tests mcp_server.py

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --all-groups --frozen
      - name: Mypy
        run: uv run mypy claude_db_memory mcp_server.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups
      - name: Pytest
        run: uv run pytest -v

  all-green:
    name: all-green
    needs: [lint, type-check, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every required job must have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
